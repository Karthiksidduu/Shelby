def _style_charts() -> None:
    """Match matplotlib charts to the page colours."""

            "figure.facecolor": CREAM,
            "axes.edgecolor": INK,

def _english_sample() -> str:
    """Build a synthetic letter string with the standard English percentages.

    Repeating each letter in proportion to its published frequency gives
    the explanation tab a fingerprint chart without pretending it is a
    ciphertext.
    """
    pieces: list[str] = []
    for letter in ALPHABET:
        pieces.append(letter * int(round(ENGLISH_FREQ[letter] * 10)))
    return "".join(pieces)


def _frequency_chart(text: str, title: str) -> plt.Figure:
    """Grouped bar chart of letter percentages in \`\`text\`\` against English."""
    _style_charts()
    observed = letter_percentages(text)
    positions = list(range(26))
    observed_heights = [observed[letter] for letter in ALPHABET]
    english_heights = [ENGLISH_FREQ[letter] for letter in ALPHABET]

    figure, axis = plt.subplots(figsize=(11, 4.2))
    axis.bar(
        [position - 0.18 for position in positions],
        observed_heights,
        width=0.36,
        label="This text",
        color=TEAL,
    )
    axis.bar(
        [position + 0.18 for position in positions],
        english_heights,
        width=0.36,
        label="English",
        color=GOLD,
    )
    axis.set_xticks(positions)
    axis.set_xticklabels(list(ALPHABET))
    axis.set_ylabel("Percent of letters")
    axis.set_title(title)
    axis.legend(frameon=False)
    axis.spines["top"].set_visible(False)
    axis.spines["right"].set_visible(False)
    figure.tight_layout()
    return figure


def _show_chart(text: str, title: str) -> None:
    """Render one frequency chart and close the figure so memory stays flat."""
    figure = _frequency_chart(text, title)
    st.pyplot(figure, width="stretch")
    plt.close(figure)


def _show_caesar_verdict(analyzed: str) -> tuple[list, dict]:
    """Show the best key and plaintext, and return the ranking for the table."""
    ranked = rank_caesar_keys(analyzed)
    best = ranked[0]
    score = confidence(ranked)
    if is_text_too_short(analyzed):
        st.warning(
            "This ciphertext has fewer than 25 letters. Frequency counts are "
            "noisy, so the top key may be wrong."
        )
    chi_value = best["chi_squared"]
    chi_label = "n/a" if math.isinf(chi_value) else f"{chi_value:.2f}"
    safe_plaintext = html.escape(best["plaintext"]) if best["plaintext"] else "—"
    # Plain HTML, not st.metric: metrics drawn into an earlier container stay blank.
    st.markdown(
        f"""
        <div class="telegram">
            <div class="stat-row">
                <div><div class="stat-label">Best key</div><div class="stat-value">{best["key"]}</div></div>
                <div><div class="stat-label">Confidence</div><div class="stat-value">{score:.1f}%</div></div>
                <div><div class="stat-label">Chi-squared</div><div class="stat-value">{chi_label}</div></div>
            </div>
            <h3>Likely plaintext</h3>
            <p class="plain-out">{safe_plaintext}</p>
        </div>
        """,
        unsafe_allow_html=True,
    )
    return ranked, best


def _render_caesar() -> None:
    """Break a Caesar cipher: metrics, ranked table, and two frequency charts."""
    st.subheader("Break Caesar Cipher")
    sample_column, paragraph_column = st.columns(2)
    if sample_column.button("Short sample: KHOOR ZRUOG"):
        # One click fills the box and ranks the keys, so you are not hunting for Analyze.
        st.session_state["caesar_ciphertext"] = SAMPLE_CIPHERTEXT
        st.session_state["caesar_analyzed"] = SAMPLE_CIPHERTEXT
        st.session_state["lecture_step"] = 3
        st.rerun()
    if paragraph_column.button("Full paragraph"):
        st.session_state["caesar_ciphertext"] = LECTURE_CAESAR
        st.session_state["caesar_analyzed"] = LECTURE_CAESAR
        st.session_state["lecture_step"] = 2
        st.rerun()

    analyzed = st.session_state.get("caesar_analyzed")
    if analyzed:
        ranked, best = _show_caesar_verdict(analyzed)
    else:
        ranked, best = None, None
        st.markdown(
            '<div class="note-card">Press <b>Analyze</b>, or load a sample above.</div>',
            unsafe_allow_html=True,
        )

    ciphertext = st.text_area(
        "Ciphertext",
        height=110,
        key="caesar_ciphertext",
        placeholder="Paste ciphertext here, or load the sample.",
    )

    if st.button("Analyze", type="primary"):
        # Store the text that was analyzed. Tab clicks rerun the script,
        # and the button itself is True only on the click that produced it.
        st.session_state["caesar_analyzed"] = ciphertext
        st.rerun()

    table_tab, chart_tab = st.tabs(["All 25 keys", "Frequency charts"])

    if not analyzed or ranked is None or best is None:
        return

    with table_tab:
        frame = pd.DataFrame(ranked)
        frame = frame.rename(
            columns={
                "rank": "Rank",
                "key": "Key",
                "plaintext": "Plaintext",
                "chi_squared": "Chi-squared",
                "word_score": "Word score",
            }
        )
        frame["Chi-squared"] = frame["Chi-squared"].map(lambda value: round(float(value), 3))
        frame["Word score"] = frame["Word score"].map(lambda value: round(float(value), 3))
        st.dataframe(frame, width="stretch", hide_index=True)
        st.caption("Rank 1 is the lowest chi-squared score. The word score breaks ties.")

    with chart_tab:
        st.write("The English fingerprint is the gold bars. A good decryption should follow them.")
        left, right = st.columns(2)
        with left:
            _show_chart(analyzed, "Ciphertext vs English")
        with right:
            _show_chart(best["plaintext"], "Best decryption vs English")


def _show_substitution_answer(solution: dict[str, object]) -> None:
    """Draw the recovered substitution plaintext above the ciphertext box."""
    ciphertext = str(solution["ciphertext"])
    plaintext = str(solution["plaintext"])
    score = float(solution["score"])  # type: ignore[arg-type]
    if is_text_too_short(ciphertext):
        st.warning(
            "This ciphertext has fewer than 25 letters. A substitution solver "
            "needs a much longer sample before the bigram score is trustworthy."
        )
    safe_plaintext = html.escape(plaintext) if plaintext else "—"
    st.markdown(
        f"""
        <div class="telegram">
            <div class="stat-label">Bigram log-score</div>
            <div class="stat-value">{score:.1f}</div>
            <h3>Recovered plaintext</h3>
            <p class="plain-out">{safe_plaintext}</p>
        </div>
        """,
        unsafe_allow_html=True,
    )
    st.caption(
        "Higher bigram log-score means more English-like letter pairs. "
        "The score is negative because it is a sum of logarithms."
    )


def _render_substitution() -> None:
    """Break a general substitution cipher with the hill-climbing solver."""
    st.subheader("Break Substitution Cipher")
    st.write(
        "A full substitution key is a permutation of A–Z. Brute force cannot "
        "search 26! keys, so the solver starts from letter frequencies and "
        "swaps letters whenever the English bigram score improves."
    )
    if st.button("Load lecture sample and solve"):
        st.session_state["substitution_ciphertext"] = LECTURE_SUBSTITUTION
        st.session_state["lecture_step"] = 4
        with st.spinner("Climbing the key space..."):
            key, plaintext, score = hill_climb_solve(LECTURE_SUBSTITUTION, seed=4)
        st.session_state["substitution_solution"] = {
            "ciphertext": LECTURE_SUBSTITUTION,
            "key": key,
            "plaintext": plaintext,
            "score": score,
        }
        st.rerun()

    solution = st.session_state.get("substitution_solution")
    if solution is None:
        st.markdown(
            '<div class="note-card">Press <b>Solve</b>, or load the lecture sample. A few thousand swaps usually take a few seconds.</div>',
            unsafe_allow_html=True,
        )
    else:
        _show_substitution_answer(solution)

    ciphertext = st.text_area(
        "Substitution ciphertext",
        height=160,
        key="substitution_ciphertext",
        placeholder="Paste a longer English ciphertext, or load the lecture sample.",
    )
    if st.button("Solve", type="primary"):
        with st.spinner("Climbing the key space..."):
            key, plaintext, score = hill_climb_solve(ciphertext)
        st.session_state["substitution_solution"] = {
            "ciphertext": ciphertext,
            "key": key,
            "plaintext": plaintext,
            "score": score,
        }
        st.rerun()

    if solution is None:
        return

    key = solution["key"]
    map_tab = st.tabs(["Key mapping"])[0]
    with map_tab:
        st.write("Read each pair as plaintext letter → ciphertext letter.")
        pairs = [
            f"<b>{ALPHABET[index]}</b>→{key[index]}" for index in range(26)
        ]
        st.markdown(
            f'<div class="map-row">{"&nbsp;&nbsp;".join(pairs[:13])}</div>',
            unsafe_allow_html=True,
        )
        st.markdown(
            f'<div class="map-row">{"&nbsp;&nbsp;".join(pairs[13:])}</div>',
            unsafe_allow_html=True,
        )
        st.code(key, language=None)
        st.caption("The key string is 26 letters: position 1 (A) through position 26 (Z).")

    st.subheader("Encrypt Demo")
    st.write("Shift a sentence forward, then paste the ciphertext into Break Caesar Cipher.")

    demo_tab, how_tab = st.tabs(["Live encrypt", "How the shift works"])

    with demo_tab:
        # The ciphertext card is filled after the inputs, but drawn above them.
        result_slot = st.container()
        if "demo_plaintext" not in st.session_state:
            st.session_state["demo_plaintext"] = ""
        if "demo_shift" not in st.session_state:
            st.session_state["demo_shift"] = SAMPLE_SHIFT

        if st.button("Load sample (fills KHOOR ZRUOG)"):
            st.session_state["demo_plaintext"] = SAMPLE_PLAINTEXT
            st.session_state["demo_shift"] = SAMPLE_SHIFT
            st.session_state["demo_ready"] = True

        plaintext = st.text_area(
            "Plaintext",
            height=140,
            key="demo_plaintext",
            placeholder="Type a sentence to encrypt.",
        )
        shift = st.number_input(
            "Shift (key)",
            min_value=1,
            max_value=25,
            step=1,
            key="demo_shift",
        )
        if st.button("Encrypt", type="primary"):
            st.session_state["demo_ready"] = True

        if st.session_state.get("demo_ready") and plaintext:
            produced = caesar_encrypt(plaintext, int(shift))
            safe_ciphertext = html.escape(produced)
            with result_slot:
                st.markdown(

                        <h3>Ciphertext</h3>
                        <p class="plain-out">{safe_ciphertext}</p>
                    </div>
                    """,
                    unsafe_allow_html=True,
                )
                st.caption("Key k shifts each letter forward by k.")
        elif st.session_state.get("demo_ready"):
            with result_slot:
                st.info("Enter a plaintext sentence, or load the sample that produces KHOOR ZRUOG.")

    with how_tab:
        st.markdown(
            """
            <div class="explain-card">
                <h3>One rule, 25 keys</h3>
                <p>Key k moves every letter forward k places in the alphabet and wraps from Z back to A.
                "HELLO" with key 3 becomes "KHOOR" because H→K, E→H, L→O, L→O, O→R.
                Spaces and punctuation stay put, which is why the word breaks still show.</p>
                <p>Decryption uses the same rule in reverse. The attack does not need the key:
                it tries all 25 reverse shifts and measures which result looks like English.</p>
            </div>
            """,
            unsafe_allow_html=True,
        )


def _render_explanation() -> None:
    """Static lecture notes: key space, the frequency fingerprint, and limits."""
    st.subheader("Why Monoalphabetic Ciphers Fail")
    space_tab, print_tab, limit_tab = st.tabs(
        ["Key space", "Frequency fingerprint", "Limitations"]
    )

    with space_tab:
        caesar_col, full_col = st.columns(2)
        caesar_col.metric("Caesar keys", "25")
        full_col.metric("Substitution keys", "26!")
        st.markdown(
            """
            <div class="explain-card">
                <h3>25 versus 26 factorial</h3>
                <p>A Caesar key is only a shift, so keys 1 through 25 can be tried by hand
                or in one short loop. A general monoalphabetic key can send A to any of
                26 letters, B to any of the remaining 25, and so on:</p>
                <p><b>26! = 403,291,461,126,605,635,584,000,000</b> (about 4.03 × 10<sup>26</sup>).</p>
                <p>That space is far too large to brute force. Frequency analysis does not
                visit every key. It proposes one good guess, then hill climbing swaps
                letters only when the text becomes more English-like.</p>
            </div>
            """,
            unsafe_allow_html=True,
        )

    with print_tab:
        st.markdown(
            """
            <div class="explain-card">
                <h3>The fingerprint survives</h3>
                <p>In a monoalphabetic cipher each plaintext letter always becomes the
                same ciphertext letter. The names change; the crowd does not.
                E is still the tallest bar, and Z is still rare. Caesar only rotates

"cryptanalysis/caesar.py": `"""Caesar cipher encryption, decryption, and brute-force search.

Convention used everywhere in this project
------------------------------------------
"Key k" means each plaintext letter was shifted *forward* by k positions
to produce the ciphertext. Decryption therefore shifts *backward* by k.

Example: "HELLO WORLD" encrypted with key 3 becomes "KHOOR ZRUOG".
Decrypting "KHOOR ZRUOG" with key 3 returns "HELLO WORLD".
Key 1 returns "JGNNQ YQTNF", and key 2 returns "IFMMP XPSME".
"""

from __future__ import annotations


def _shift_letter(character: str, shift: int) -> str:
    """Shift one character by \`\`shift\`\` places, preserving non-letters.

    Uppercase and lowercase are shifted inside their own alphabet so
    "Hello" stays "Hello" in shape. Digits, spaces, and punctuation
    are returned unchanged. The shift is wrapped with modulo 26, so
    a shift of 27 is the same as a shift of 1.
    """
    if character.isupper():
        alphabet_start = ord("A")
        offset = ord(character) - alphabet_start
        return chr(alphabet_start + (offset + shift) % 26)
    if character.islower():
        alphabet_start = ord("a")
        offset = ord(character) - alphabet_start
        return chr(alphabet_start + (offset + shift) % 26)
    return character


def caesar_encrypt(text: str, shift: int) -> str:
    """Encrypt \`\`text\`\` by shifting every letter forward by \`\`shift\`\`.

    Only the letters A-Z and a-z move. Case, spaces, digits, and
    punctuation are preserved.
    """
    return "".join(_shift_letter(character, shift) for character in text)


def caesar_decrypt(text: str, shift: int) -> str:
    """Decrypt \`\`text\`\` that was encrypted with Caesar key \`\`shift\`\`.

    This is encryption with the opposite shift. Key 3 decrypts by
    shifting each letter back three places.
    """
    return caesar_encrypt(text, -shift)


def brute_force(ciphertext: str) -> list[tuple[int, str]]:
    """Try every useful Caesar key and return \`\`(key, plaintext)\`\` pairs.

    Key 0 is skipped because it leaves the ciphertext unchanged, so
    there are exactly 25 candidates (keys 1 through 25).
    """
    return [(key, caesar_decrypt(ciphertext, key)) for key in range(1, 26)]

"cryptanalysis/frequency.py": `"""Frequency analysis and scoring for Caesar cipher candidates.

A Caesar cipher only rotates the alphabet, so the letter-frequency
fingerprint of English survives. These functions measure that
fingerprint and rank the 25 possible keys.
"""

from __future__ import annotations

import math
import re
from typing import TypedDict

from cryptanalysis.caesar import brute_force
from cryptanalysis.english_stats import COMMON_WORDS, ENGLISH_FREQ

# Lookup set so dictionary checks are a single hash lookup per word.
_COMMON_WORD_SET: set[str] = set(COMMON_WORDS)

# The 26 letters, in alphabet order. Charts and counts always use this order.
ALPHABET: str = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"


class CaesarCandidate(TypedDict):
    """One decrypted Caesar candidate, plus the scores used to rank it."""

    rank: int
    key: int
    plaintext: str
    chi_squared: float
    word_score: float


def letter_counts(text: str) -> dict[str, int]:
    """Count A-Z letters in \`\`text\`\`, ignoring case and non-letters.

    Every letter from A to Z is present in the result, even when its
    count is zero. That keeps later percentage and chi-squared code
    from having to handle missing keys.
    """
    counts: dict[str, int] = {letter: 0 for letter in ALPHABET}
    for character in text.upper():
        if character in counts:
            counts[character] += 1
    return counts


def letter_percentages(text: str) -> dict[str, float]:
    """Return A-Z letter frequencies in \`\`text\`\` as percentages.

    The scale matches \`\`ENGLISH_FREQ\`\`: 12.7 means "12.7 percent of
    the letters", not a fraction between 0 and 1. An empty text
    returns 0 for every letter.
    """
    counts = letter_counts(text)
    total = sum(counts.values())
    if total == 0:
        return {letter: 0.0 for letter in ALPHABET}
    return {letter: (counts[letter] / total) * 100.0 for letter in ALPHABET}


def chi_squared(text: str) -> float:
    """Chi-squared distance between \`\`text\`\` and standard English.

    For each letter the formula is \`\`(observed - expected) ** 2 / expected\`\`.
    \`\`observed\`\` is the raw count. \`\`expected\`\` is the English percentage
    scaled to the same number of letters. A lower total means the text
    looks more like English. Text with no letters returns infinity so
    it sorts to the bottom of a ranking.
    """
    counts = letter_counts(text)
    total = sum(counts.values())
    if total == 0:
        return math.inf

    # Normalise in case the published percentages are a hair off 100.
    frequency_total = sum(ENGLISH_FREQ.values())
    statistic = 0.0
    for letter in ALPHABET:
        observed = counts[letter]
        expected = (ENGLISH_FREQ[letter] / frequency_total) * total
        statistic += (observed - expected) ** 2 / expected
    return statistic


def dictionary_score(text: str) -> float:
    """Fraction of words in \`\`text\`\` that are in the common-word list.

    Words are runs of letters. Case and surrounding punctuation are
    ignored. The result is between 0 and 1. Text with no words scores 0.
    """
    words = re.findall(r"[A-Za-z]+", text.lower())
    if not words:
        return 0.0
    hits = sum(1 for word in words if word in _COMMON_WORD_SET)
    return hits / len(words)


def rank_caesar_keys(ciphertext: str) -> list[CaesarCandidate]:
    """Rank all 25 Caesar keys. The best candidate has rank 1.

    Each candidate is decrypted, then scored with chi-squared (lower
    is better) and with the common-word fraction (higher is better).
    Sort order is chi-squared first. The word score only breaks ties,
    which matters for very short samples such as "HELLO WORLD".
    """
    candidates: list[CaesarCandidate] = []
    for key, plaintext in brute_force(ciphertext):
        candidates.append(
            {
                "rank": 0,
                "key": key,
                "plaintext": plaintext,
                "chi_squared": chi_squared(plaintext),
                "word_score": dictionary_score(plaintext),
            }
        )

    candidates.sort(key=lambda row: (row["chi_squared"], -row["word_score"], row["key"]))
    for index, row in enumerate(candidates, start=1):
        row["rank"] = index
    return candidates


def confidence(ranked: list[CaesarCandidate]) -> float:
    """Score from 0 to 100 for how clearly the best key beats the runner-up.

    The gap is \`\`(second - best) / second\`\`. A big gap means the best
    chi-squared value is much smaller than the next one, so the result
    is trustworthy. Equal scores, missing rows, or infinite scores
    (no letters) produce 0.
    """
    if len(ranked) < 2:
        return 0.0

    best = float(ranked[0]["chi_squared"])
    second = float(ranked[1]["chi_squared"])
    if math.isinf(best) or math.isinf(second) or second == 0:
        return 0.0

    gap = (second - best) / second * 100.0
    return max(0.0, min(100.0, gap))


def is_text_too_short(text: str, minimum: int = 25) -> bool:
    """Return True when \`\`text\`\` has fewer than \`\`minimum\`\` letters.

    Frequency counts from a handful of letters are mostly noise, so
    callers show a warning instead of trusting the top key blindly.
    """
    letter_total = sum(letter_counts(text).values())
    return letter_total < minimum

"cryptanalysis/report.py": `"""Plain-text report for a Caesar ciphertext.

Run from the project directory:

    python -m cryptanalysis.report "KHOOR ZRUOG"
"""

from __future__ import annotations

import sys

from cryptanalysis.frequency import confidence, is_text_too_short, rank_caesar_keys


def format_report(ciphertext: str) -> str:
    """Return a multi-line Caesar analysis report for \`\`ciphertext\`\`.

    The three strongest keys are listed so the best one appears last
    and is marked with a check. A confidence percentage is always
    included. A warning line is added when the ciphertext has fewer
    than 25 letters.
    """
    ranked = rank_caesar_keys(ciphertext)
    top_three = ranked[:3]
    # Reverse the top three so the best key is printed last.
    display_order = list(reversed(top_three))

    lines: list[str] = [
        f"Ciphertext: {ciphertext}",
        "",
        "Cipher Type: Caesar Cipher",
        "Possible Keys:",
    ]

    best_key = ranked[0]["key"] if ranked else None
    for row in display_order:
        marker = " ✓" if row["key"] == best_key else ""
        lines.append(f"Key {row['key']} -> {row['plaintext']}{marker}")

    likely_plaintext = ranked[0]["plaintext"] if ranked else ""
    lines.append("")
    lines.append(f"Likely Plaintext: {likely_plaintext}")
    lines.append(f"Confidence: {confidence(ranked):.1f}%")
    if is_text_too_short(ciphertext):
        lines.append(
            "Warning: Ciphertext is too short for a reliable result (fewer than 25 letters)."
        )
    return "\\n".join(lines)


def main(argv: list[str] | None = None) -> None:
    """Print a report for the ciphertext given on the command line."""
    arguments = list(sys.argv[1:] if argv is None else argv)
    if not arguments:
        print('Usage: python -m cryptanalysis.report "KHOOR ZRUOG"')
        return
    # Join so a quoted sentence with spaces arrives as one ciphertext.
    ciphertext = " ".join(arguments)
    print(format_report(ciphertext))


if __name__ == "__main__":
    main()

"cryptanalysis/substitution.py": `"""Hill-climbing solver for a general monoalphabetic substitution cipher.

Algorithm
---------
A substitution cipher replaces each plaintext letter with one fixed
ciphertext letter. The key is a permutation of the 26 letters: position
0 says what plaintext A becomes, position 1 says what B becomes, and so
on. There are 26! such keys (about 4 x 10^26), so trying every key is
impossible. This module searches instead:

1. \`\`initial_guess\`\` lines the ciphertext letters up by frequency with
   the English letters E, T, A, O, I, N, ... The most common ciphertext
   letter is guessed to be E, the next to be T, and so on.
2. \`\`hill_climb_solve\`\` turns that guess into a key, then repeatedly
   swaps two letters in the key. A swap is kept only when the bigram
   log-probability of the decrypted text goes up.
3. Later restarts begin from a fresh random permutation, so one unlucky
   local peak does not end the search. The first restart still starts
   from the frequency guess.
4. A final pass tries every pair of letters and keeps any swap that
   still improves the score. That locks in gains the random swaps missed.

The score is the sum of log probabilities of consecutive letter pairs
inside each word. Common English pairs such as TH and HE raise the
score. Pairs that almost never occur pull it down. Spaces break words,
so "THE CAT" contributes TH, HE, CA, and AT. The pair EC is not counted,
because those letters were never neighbours in English; only the cipher
left them on either side of a space.
"""

from __future__ import annotations

import math
import random

from cryptanalysis.english_stats import ENGLISH_FREQ
from cryptanalysis.frequency import ALPHABET, letter_counts

# Approximate percent frequencies of the most common English letter pairs.
# The exact values are rounded textbook figures. Only the ranking among
# pairs matters to the hill climber, not the third decimal place.
BIGRAM_FREQ: dict[str, float] = {
    "TH": 2.71, "HE": 2.33, "IN": 2.03, "ER": 1.78, "AN": 1.61,
    "RE": 1.41, "ES": 1.32, "ON": 1.32, "ST": 1.25, "NT": 1.17,
    "EN": 1.13, "AT": 1.12, "ED": 1.08, "ND": 1.07, "TO": 1.07,
    "OR": 1.06, "EA": 1.00, "TI": 0.99, "AR": 0.98, "TE": 0.98,
    "NG": 0.89, "AL": 0.88, "IT": 0.88, "AS": 0.87, "IS": 0.86,
    "HA": 0.83, "ET": 0.76, "SE": 0.73, "OU": 0.72, "OF": 0.71,
    "LE": 0.69, "SA": 0.67, "VE": 0.66, "RO": 0.64, "RA": 0.64,
    "RI": 0.63, "HI": 0.62, "NE": 0.59, "ME": 0.57, "DE": 0.55,
    "CO": 0.55, "IO": 0.54, "IC": 0.53, "EL": 0.52, "LI": 0.51,
    "LL": 0.50, "CE": 0.49, "TA": 0.48, "MA": 0.47, "SI": 0.46,
    "OM": 0.45, "UR": 0.44, "CA": 0.43, "LA": 0.42, "NS": 0.41,
    "DI": 0.40, "FO": 0.39, "HO": 0.38, "PE": 0.37, "EC": 0.36,
    "PR": 0.35, "NO": 0.34, "CT": 0.33, "US": 0.32, "AC": 0.31,
    "OT": 0.31, "IL": 0.30, "TR": 0.30, "LY": 0.29, "NC": 0.28,
    "UT": 0.27, "SS": 0.27, "SO": 0.26, "RS": 0.26, "UN": 0.25,
    "LO": 0.25, "WA": 0.24, "GE": 0.24, "IE": 0.23, "WH": 0.23,
    "EE": 0.22, "WI": 0.21, "EM": 0.20, "AD": 0.20, "OL": 0.19,
    "RT": 0.19, "PO": 0.18, "WE": 0.18, "RD": 0.17, "KE": 0.16,
    "GH": 0.15, "RY": 0.15, "CH": 0.14, "BE": 0.14, "OW": 0.13,
    "LD": 0.13,
}

# Unseen pairs are rare, not impossible. A small floor stops log(0)
# and still punishes pairs that are missing from the table above.
_UNSEEN_BIGRAM_FLOOR: float = 0.005


def _build_log_table() -> dict[str, float]:
    """Pre-compute log probability for every possible letter pair.

    Listed bigrams use their table value. Every other pair uses the
    floor. Dividing by the grand total turns those weights into
    probabilities before the logarithm.
    """
    listed_total = sum(BIGRAM_FREQ.values())
    unseen_pairs = (26 * 26) - len(BIGRAM_FREQ)
    grand_total = listed_total + (_UNSEEN_BIGRAM_FLOOR * unseen_pairs)

    log_table: dict[str, float] = {}
    for first in ALPHABET:
        for second in ALPHABET:
            pair = first + second
            weight = BIGRAM_FREQ.get(pair, _UNSEEN_BIGRAM_FLOOR)
            log_table[pair] = math.log(weight / grand_total)
    return log_table


_LOG_PROB: dict[str, float] = _build_log_table()


def _words(text: str) -> list[str]:
    """Return the uppercase words in \`\`text\`\`.

    A word is a run of letters. Spaces and punctuation separate words,
    so bigrams are not counted across a gap the cipher never mixed.
    """
    cleaned = "".join(character.upper() if character.isalpha() else " " for character in text)
    return [word for word in cleaned.split(" ") if word]


def _validate_key(key: str) -> str:
    """Return \`\`key\`\` in uppercase, or raise ValueError if it is not a permutation."""
    normalised = key.upper()
    if len(normalised) != 26 or sorted(normalised) != list(ALPHABET):
        raise ValueError("key must be a 26-letter permutation of A-Z")
    return normalised


def substitution_encrypt(text: str, key: str) -> str:
    """Encrypt \`\`text\`\` with a 26-letter substitution \`\`key\`\`.

    \`\`key[0]\`\` is the ciphertext letter for plaintext A, \`\`key[1]\`\` is
    the ciphertext letter for B, and so on. Case is preserved.
    Non-letters are copied through unchanged.
    """
    normalised = _validate_key(key)
    mapping = {ALPHABET[index]: normalised[index] for index in range(26)}
    output: list[str] = []
    for character in text:
        if character.isalpha():
            replacement = mapping[character.upper()]
            output.append(replacement if character.isupper() else replacement.lower())
        else:
            output.append(character)
    return "".join(output)


def substitution_decrypt(text: str, key: str) -> str:
    """Decrypt \`\`text\`\` that was encrypted with substitution \`\`key\`\`.

    The encryption key maps plaintext letters to ciphertext letters.
    Inverting that map, then encrypting with the inverse, recovers
    the plaintext.
    """
    normalised = _validate_key(key)
    inverse = ["?"] * 26
    for plain_index, cipher_letter in enumerate(normalised):
        inverse[ord(cipher_letter) - ord("A")] = ALPHABET[plain_index]
    return substitution_encrypt(text, "".join(inverse))


def random_key(seed: int | None = None) -> str:
    """Return a random 26-letter permutation key.

    Pass \`\`seed\`\` when a test or a demo must produce the same key again.
    """
    generator = random.Random(seed)
    letters = list(ALPHABET)
    generator.shuffle(letters)
    return "".join(letters)


def bigram_score(text: str) -> float:
    """Sum of log probabilities of consecutive letter pairs inside words.

    Higher (closer to zero, since logs of probabilities are negative)
    means the letter pairs look more like English. Pairs are not counted
    across spaces or punctuation.
    """
    total = 0.0
    for word in _words(text):
        for index in range(len(word) - 1):
            total += _LOG_PROB[word[index] + word[index + 1]]
    return total


def _cipher_bigram_counts(ciphertext: str) -> dict[str, int]:
    """Count ciphertext letter pairs inside each word, for fast rescoring."""
    counts: dict[str, int] = {}
    for word in _words(ciphertext):
        for index in range(len(word) - 1):
            pair = word[index] + word[index + 1]
            counts[pair] = counts.get(pair, 0) + 1
    return counts


def _score_key(key: str, cipher_bigrams: dict[str, int]) -> float:
    """Score an encryption \`\`key\`\` using pre-counted ciphertext bigrams.

    Each ciphertext pair is translated with the inverse of \`\`key\`\`, then
    looked up in the English log-probability table. Doing this from the
    counts, rather than rebuilding the plaintext string, keeps the
    thousands of trial swaps cheap.
    """
    plain_for_cipher = ["?"] * 26
    for plain_index, cipher_letter in enumerate(key):
        plain_for_cipher[ord(cipher_letter) - ord("A")] = ALPHABET[plain_index]

    total = 0.0
    for pair, count in cipher_bigrams.items():
        plain_pair = (
            plain_for_cipher[ord(pair[0]) - ord("A")]
            + plain_for_cipher[ord(pair[1]) - ord("A")]
        )
        total += count * _LOG_PROB[plain_pair]
    return total


def _swap_key(key: str, first: int, second: int) -> str:
    """Return \`\`key\`\` with the letters at two indexes exchanged."""
    characters = list(key)
    characters[first], characters[second] = characters[second], characters[first]
    return "".join(characters)


def initial_guess(ciphertext: str) -> str:
    """Build a frequency-based encryption key for \`\`ciphertext\`\`.

    Ciphertext letters are sorted from most common to least common.
    English letters are sorted the same way (E, then T, then A, ...).
    The most common ciphertext letter is assumed to decrypt to E, the
    next to T, and so on. Ties are broken alphabetically so the guess
    is stable. The returned string is an encryption key: index 0 is
    the ciphertext image of plaintext A.
    """
    counts = letter_counts(ciphertext)
    cipher_order = sorted(ALPHABET, key=lambda letter: (-counts[letter], letter))
    english_order = sorted(
        ALPHABET,
        key=lambda letter: (-ENGLISH_FREQ[letter], letter),
    )

    # decrypt_map[cipher_letter] = guessed plaintext letter.
    decrypt_map = {
        cipher_letter: english_letter
        for cipher_letter, english_letter in zip(cipher_order, english_order)
    }
    encrypt_key = ["?"] * 26
    for cipher_letter, plain_letter in decrypt_map.items():
        encrypt_key[ord(plain_letter) - ord("A")] = cipher_letter
    return "".join(encrypt_key)


def _polish(key: str, cipher_bigrams: dict[str, int], max_passes: int = 40) -> tuple[str, float]:
    """Try every pair swap until none of them improves the score.

    This is the same "keep the swap only if the score rises" rule as
    the random search, but it checks all 325 pairs so a near-finished
    key is not left one swap short of the best neighbour.
    """
    current = key
    current_score = _score_key(current, cipher_bigrams)
    for _ in range(max_passes):
        improved = False
        for first in range(26):
            for second in range(first + 1, 26):
                trial = _swap_key(current, first, second)
                trial_score = _score_key(trial, cipher_bigrams)
                if trial_score > current_score:
                    current = trial
                    current_score = trial_score
                    improved = True
        if not improved:
            break
    return current, current_score


def hill_climb_solve(
    ciphertext: str,
    iterations: int = 5000,
    restarts: int = 5,
    seed: int | None = None,
) -> tuple[str, str, float]:
    """Search for the substitution key and return \`\`(key, plaintext, score)\`\`.

    The first restart starts from \`\`initial_guess\`\`. Each later restart
    starts from a new random permutation, so the search can leave a
    valley where the frequency guess got stuck. Inside a restart the
    function proposes \`\`iterations\`\` random swaps and keeps a swap only
    when the bigram score improves. Each restart then tries every pair
    of letters and keeps improving swaps. The best key is returned.

    \`\`score\`\` is the bigram log-probability of the recovered plaintext
    (higher is better). \`\`seed\`\` makes the random swaps repeatable.
    """
    if restarts < 1:
        raise ValueError("restarts must be at least 1")
    if iterations < 0:
        raise ValueError("iterations cannot be negative")

    generator = random.Random(seed)
    starting_key = initial_guess(ciphertext)
    cipher_bigrams = _cipher_bigram_counts(ciphertext)

    best_key = starting_key
    best_score = _score_key(best_key, cipher_bigrams)

    for restart in range(restarts):
        if restart == 0:
            current = starting_key
        else:
            # A fresh permutation, so this restart is not stuck in the same
            # valley as the frequency guess. The first restart still begins
            # from that guess, which is the right start when the text is long.
            letters = list(ALPHABET)
            generator.shuffle(letters)
            current = "".join(letters)
        current_score = _score_key(current, cipher_bigrams)

        for _ in range(iterations):
            left, right = generator.sample(range(26), 2)
            trial = _swap_key(current, left, right)
            trial_score = _score_key(trial, cipher_bigrams)
            if trial_score > current_score:
                current = trial
                current_score = trial_score

        # Full pair check: keep any swap the random phase never proposed.
        current, current_score = _polish(current, cipher_bigrams)
        if current_score > best_score:
            best_key = current
            best_score = current_score
    plaintext = substitution_decrypt(ciphertext, best_key)
    # Report the public scoring function so the number matches bigram_score.
    return best_key, plaintext, bigram_score(plaintext)
