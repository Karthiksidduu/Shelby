    <div id="root"></div>
    <script id="files" type="application/json">{"app.py": "\"\"\"Streamlit demo: break a Caesar cipher, break a substitution cipher, and explain why.\n\nLaunch from the project directory:\n\n    streamlit run app.py\n\nThe sidebar chooses the mode. Each mode uses tabs for its sections.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport html\nimport math\n\nimport matplotlib.pyplot as plt\nimport pandas as pd\nimport streamlit as st\n\nfrom cryptanalysis.caesar import caesar_encrypt\nfrom cryptanalysis.english_stats import ENGLISH_FREQ\nfrom cryptanalysis.frequency import (\n    ALPHABET,\n    confidence,\n    is_text_too_short,\n    letter_percentages,\n    rank_caesar_keys,\n)\nfrom cryptanalysis.substitution import hill_climb_solve, random_key, substitution_encrypt\n\n# Classroom sample used by the brief: \"HELLO WORLD\" shifted by 3.\nSAMPLE_CIPHERTEXT = \"KHOOR ZRUOG\"\nSAMPLE_PLAINTEXT = \"HELLO WORLD\"\nSAMPLE_SHIFT = 3\n\n# A paragraph long enough for chi-squared to recover the shift in one click.\n# The true shift is 11. The lecture buttons never ask you to type this in.\nLECTURE_PARAGRAPH = (\n    \"The students gathered in the lab to see why a simple shift cipher fails. \"\n    \"They typed a long English sentence, hid it with a secret shift, and then \"\n    \"asked the program to try every possible key. The correct sentence was the \"\n    \"one whose letters behaved like ordinary English.\"\n)\nLECTURE_SHIFT = 11\nLECTURE_CAESAR = caesar_encrypt(LECTURE_PARAGRAPH, LECTURE_SHIFT)\n\n# Fixed key (seed 4) so the substitution demo is the same every time you present.\nLECTURE_SUBSTITUTION_PLAIN = (\n    \"In the history of secret writing a substitution cipher replaces every letter \"\n    \"with another letter and then keeps that choice for the whole message. English \"\n    \"still shows through because the letter e remains common and the pair th keeps \"\n    \"returning in words such as the that and with. A student can count those letters \"\n    \"line them up with the usual English order and then swap two guesses whenever \"\n    \"the text begins to look like real words. With a few hundred letters the pattern \"\n    \"is strong enough that the original message comes back almost intact which is \"\n    \"why this classical cipher is no longer a serious way to protect information.\"\n)\nLECTURE_SUBSTITUTION = substitution_encrypt(LECTURE_SUBSTITUTION_PLAIN, random_key(4))\n\nMODES: list[str] = [\n    \"Break Caesar Cipher\",\n    \"Break Substitution Cipher\",\n    \"Encrypt Demo\",\n    \"Why Monoalphabetic Ciphers Fail\",\n]\n\n# Spoken cues for the five sidebar buttons, in presentation order.\nLECTURE_CUES: dict[int, str] = {\n    1: \"Say: every letter moved forward 3 places, so HELLO became KHOOR. Next I will hide a whole paragraph and not tell the program the key.\",\n    2: \"Say: this paragraph was shifted by a secret amount. The true shift is 11. If the best key is 11, the attack worked.\",\n    3: \"Say: the same attack on only ten letters is a guess. The true text is HELLO WORLD, key 3. The warning is the point of this slide.\",\n    4: \"Say: a full substitution cipher has 26 factorial keys, so we cannot try them all. Frequency analysis plus hill climbing still reads the message. A few letters may stay swapped.\",\n    5: \"Say: Caesar has 25 keys and still leaks English letter frequencies. AES does not leave this fingerprint.\",\n}\nLECTURE_STEP_MODE: dict[int, str] = {\n    1: \"Encrypt Demo\",\n    2: \"Break Caesar Cipher\",\n    3: \"Break Caesar Cipher\",\n    4: \"Break Substitution Cipher\",\n    5: \"Why Monoalphabetic Ciphers Fail\",\n}\n\n# Warm paper, ink, and jewel tones. Chosen so a lecture-hall projector\n# still shows strong contrast.\nINK = \"#1c1915\"\nGOLD = \"#9a6b2f\"\nTEAL = \"#1f6f6a\"\nCORAL = \"#9a3b2f\"\nCREAM = \"#fffaf3\"\nPAPER = \"#f4efe4\"\n\n\ndef _inject_styles() -> None:\n    \"\"\"Apply the page theme. Streamlit has no built-in 'exhibition' layout.\"\"\"\n    st.markdown(\n        \"\"\"\n        \u003cstyle>\n            @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Source+Sans+3:wght@400;600;700&display=swap');\n\n            .stApp {\n                background:\n                    radial-gradient(1200px 500px at 10% -10%, rgba(154, 107, 47, 0.16), transparent 55%),\n                    radial-gradient(900px 420px at 100% 0%, rgba(31, 111, 106, 0.12), transparent 50%),\n                    linear-gradient(180deg, #fbf7f0 0%, #f3eadc 100%);\n                color: #1c1915;\n                font-family: \"Source Sans 3\", \"Segoe UI\", sans-serif;\n            }\n            header[data-testid=\"stHeader\"] {\n                background: transparent;\n            }\n            section[data-testid=\"stSidebar\"] {\n                background: linear-gradient(180deg, #2a241e 0%, #1a1613 100%);\n                border-right: 1px solid rgba(226, 196, 140, 0.25);\n                min-width: 22rem !important;\n                width: 22rem !important;\n            }\n            [data-testid=\"stToolbar\"] {\n                display: none;\n            }\n            section[data-testid=\"stSidebar\"] h1,\n            section[data-testid=\"stSidebar\"] h2,\n            section[data-testid=\"stSidebar\"] h3,\n            section[data-testid=\"stSidebar\"] p,\n            section[data-testid=\"stSidebar\"] label,\n            section[data-testid=\"stSidebar\"] span {\n                color: #f6f0e6 !important;\n            }\n            section[data-testid=\"stSidebar\"] .stRadio label {\n                background: rgba(255, 250, 243, 0.06);\n                border: 1px solid rgba(226, 196, 140, 0.18);\n                border-radius: 12px;\n                padding: 0.55rem 0.75rem;\n                margin-bottom: 0.4rem;\n                line-height: 1.25;\n            }\n            section[data-testid=\"stSidebar\"] .stButton button {\n                width: 100%;\n                border: none;\n                border-radius: 12px;\n                background: #e4c48c;\n                font-weight: 700;\n            }\n            section[data-testid=\"stSidebar\"] .stButton button p {\n                color: #1c1915 !important;\n                font-weight: 700;\n            }\n            .hero {\n                padding: 0.2rem 0 1rem 0;\n            }\n            .eyebrow {\n                letter-spacing: 0.18em;\n                text-transform: uppercase;\n                color: #9a6b2f;\n                font-weight: 700;\n                font-size: 0.78rem;\n                margin-bottom: 0.35rem;\n            }\n            .hero h1 {\n                font-family: Fraunces, Georgia, serif;\n                font-size: 2.6rem;\n                line-height: 1.05;\n                color: #1c1915;\n                margin: 0;\n            }\n            .lede {\n                font-size: 1.12rem;\n                color: #3d3832;\n                max-width: 46rem;\n                margin-top: 0.6rem;\n            }\n            .telegram {\n                background: #fffaf3;\n                border: 1px solid rgba(28, 25, 21, 0.12);\n                border-left: 6px solid #1f6f6a;\n                border-radius: 16px;\n                padding: 1.1rem 1.25rem 0.4rem 1.25rem;\n                box-shadow: 0 14px 40px rgba(60, 40, 15, 0.08);\n            }\n            .telegram h3 {\n                font-family: Fraunces, Georgia, serif;\n                margin-top: 0.4rem;\n            }\n            .stat-row {\n                display: flex;\n                gap: 1.5rem;\n                margin-bottom: 0.4rem;\n            }\n            .stat-label {\n                letter-spacing: 0.08em;\n                text-transform: uppercase;\n                font-size: 0.75rem;\n                color: #6b6256;\n                font-weight: 700;\n            }\n            .stat-value {\n                font-family: Fraunces, Georgia, serif;\n                font-size: 1.8rem;\n                color: #1c1915;\n                line-height: 1.1;\n            }\n            .plain-out {\n                font-family: Fraunces, Georgia, serif;\n                font-size: 1.8rem;\n                line-height: 1.25;\n                color: #1f6f6a;\n                margin: 0.2rem 0 0.8rem 0;\n                overflow-wrap: anywhere;\n            }\n            .note-card, .explain-card {\n                background: rgba(255, 250, 243, 0.78);\n                border: 1px solid rgba(28, 25, 21, 0.08);\n                border-radius: 16px;\n                padding: 0.9rem 1rem;\n                margin-bottom: 0.8rem;\n            }\n            .explain-card h3 {\n                font-family: Fraunces, Georgia, serif;\n                margin-top: 0.2rem;\n            }\n            .key-chip {\n                display: inline-block;\n                background: #1c1915;\n                color: #f6f0e6;\n                border-radius: 999px;\n                padding: 0.15rem 0.7rem;\n                font-weight: 700;\n                letter-spacing: 0.04em;\n            }\n            .map-row {\n                font-family: \"Source Sans 3\", sans-serif;\n                letter-spacing: 0.04em;\n                font-size: 1rem;\n                background: #fffaf3;\n                border-radius: 12px;\n                padding: 0.7rem 0.8rem;\n                border: 1px solid rgba(28, 25, 21, 0.08);\n                margin-bottom: 0.4rem;\n            }\n            div[data-testid=\"stMetric\"] {\n                background: #fffaf3;\n                border: 1px solid rgba(28, 25, 21, 0.08);\n                border-radius: 16px;\n                padding: 0.7rem 0.9rem;\n                box-shadow: 0 10px 24px rgba(60, 40, 15, 0.05);\n            }\n        \u003c/style>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef _hero(compact: bool = False) -> None:\n    \"\"\"Draw the title block. A lecture step uses a shorter title so the answer fits.\"\"\"\n    if compact:\n        st.markdown(\n            \"\"\"\n            \u003cdiv class=\"hero\">\n                \u003cdiv class=\"eyebrow\">Frequency analysis · classical ciphers\u003c/div>\n                \u003ch1 style=\"font-size:1.7rem;\">Automated Cryptanalysis of Classical Ciphers\u003c/h1>\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n        return\n    st.markdown(\n        \"\"\"\n        \u003cdiv class=\"hero\">\n            \u003cdiv class=\"eyebrow\">Frequency analysis · classical ciphers\u003c/div>\n            \u003ch1>Automated Cryptanalysis of Classical Ciphers\u003c/h1>\n            \u003cp class=\"lede\">\n                Recover the plaintext without the key. A Caesar cipher has only 25\n                useful shifts, and a full substitution cipher still leaks the\n                letter-frequency fingerprint of English.\n            \u003c/p>\n        \u003c/div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef _style_charts() -> None:\n    \"\"\"Match matplotlib charts to the page colours.\"\"\"\n    plt.rcParams.update(\n        {\n            \"axes.facecolor\": CREAM,\n            \"figure.facecolor\": CREAM,\n            \"axes.edgecolor\": INK,\n            \"axes.labelcolor\": INK,\n            \"xtick.color\": INK,\n            \"ytick.color\": INK,\n            \"text.color\": INK,\n            \"font.size\": 11,\n        }\n    )\n\n\ndef _english_sample() -> str:\n    \"\"\"Build a synthetic letter string with the standard English percentages.\n\n    Repeating each letter in proportion to its published frequency gives\n    the explanation tab a fingerprint chart without pretending it is a\n    ciphertext.\n    \"\"\"\n    pieces: list[str] = []\n    for letter in ALPHABET:\n        pieces.append(letter * int(round(ENGLISH_FREQ[letter] * 10)))\n    return \"\".join(pieces)\n\n\ndef _frequency_chart(text: str, title: str) -> plt.Figure:\n    \"\"\"Grouped bar chart of letter percentages in ``text`` against English.\"\"\"\n    _style_charts()\n    observed = letter_percentages(text)\n    positions = list(range(26))\n    observed_heights = [observed[letter] for letter in ALPHABET]\n    english_heights = [ENGLISH_FREQ[letter] for letter in ALPHABET]\n\n    figure, axis = plt.subplots(figsize=(11, 4.2))\n    axis.bar(\n        [position - 0.18 for position in positions],\n        observed_heights,\n        width=0.36,\n        label=\"This text\",\n        color=TEAL,\n    )\n    axis.bar(\n        [position + 0.18 for position in positions],\n        english_heights,\n        width=0.36,\n        label=\"English\",\n        color=GOLD,\n    )\n    axis.set_xticks(positions)\n    axis.set_xticklabels(list(ALPHABET))\n    axis.set_ylabel(\"Percent of letters\")\n    axis.set_title(title)\n    axis.legend(frameon=False)\n    axis.spines[\"top\"].set_visible(False)\n    axis.spines[\"right\"].set_visible(False)\n    figure.tight_layout()\n    return figure\n\n\ndef _show_chart(text: str, title: str) -> None:\n    \"\"\"Render one frequency chart and close the figure so memory stays flat.\"\"\"\n    figure = _frequency_chart(text, title)\n    st.pyplot(figure, width=\"stretch\")\n    plt.close(figure)\n\n\ndef _show_caesar_verdict(analyzed: str) -> tuple[list, dict]:\n    \"\"\"Show the best key and plaintext, and return the ranking for the table.\"\"\"\n    ranked = rank_caesar_keys(analyzed)\n    best = ranked[0]\n    score = confidence(ranked)\n    if is_text_too_short(analyzed):\n        st.warning(\n            \"This ciphertext has fewer than 25 letters. Frequency counts are \"\n            \"noisy, so the top key may be wrong.\"\n        )\n    chi_value = best[\"chi_squared\"]\n    chi_label = \"n/a\" if math.isinf(chi_value) else f\"{chi_value:.2f}\"\n    safe_plaintext = html.escape(best[\"plaintext\"]) if best[\"plaintext\"] else \"—\"\n    # Plain HTML, not st.metric: metrics drawn into an earlier container stay blank.\n    st.markdown(\n        f\"\"\"\n        \u003cdiv class=\"telegram\">\n            \u003cdiv class=\"stat-row\">\n                \u003cdiv>\u003cdiv class=\"stat-label\">Best key\u003c/div>\u003cdiv class=\"stat-value\">{best[\"key\"]}\u003c/div>\u003c/div>\n                \u003cdiv>\u003cdiv class=\"stat-label\">Confidence\u003c/div>\u003cdiv class=\"stat-value\">{score:.1f}%\u003c/div>\u003c/div>\n                \u003cdiv>\u003cdiv class=\"stat-label\">Chi-squared\u003c/div>\u003cdiv class=\"stat-value\">{chi_label}\u003c/div>\u003c/div>\n            \u003c/div>\n            \u003ch3>Likely plaintext\u003c/h3>\n            \u003cp class=\"plain-out\">{safe_plaintext}\u003c/p>\n        \u003c/div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n    return ranked, best\n\n\ndef _render_caesar() -> None:\n    \"\"\"Break a Caesar cipher: metrics, ranked table, and two frequency charts.\"\"\"\n    st.subheader(\"Break Caesar Cipher\")\n    sample_column, paragraph_column = st.columns(2)\n    if sample_column.button(\"Short sample: KHOOR ZRUOG\"):\n        # One click fills the box and ranks the keys, so you are not hunting for Analyze.\n        st.session_state[\"caesar_ciphertext\"] = SAMPLE_CIPHERTEXT\n        st.session_state[\"caesar_analyzed\"] = SAMPLE_CIPHERTEXT\n        st.session_state[\"lecture_step\"] = 3\n        st.rerun()\n    if paragraph_column.button(\"Full paragraph\"):\n        st.session_state[\"caesar_ciphertext\"] = LECTURE_CAESAR\n        st.session_state[\"caesar_analyzed\"] = LECTURE_CAESAR\n        st.session_state[\"lecture_step\"] = 2\n        st.rerun()\n\n    analyzed = st.session_state.get(\"caesar_analyzed\")\n    if analyzed:\n        ranked, best = _show_caesar_verdict(analyzed)\n    else:\n        ranked, best = None, None\n        st.markdown(\n            '\u003cdiv class=\"note-card\">Press \u003cb>Analyze\u003c/b>, or use a gold button in the sidebar.\u003c/div>',\n            unsafe_allow_html=True,\n        )\n\n    ciphertext = st.text_area(\n        \"Ciphertext\",\n        height=110,\n        key=\"caesar_ciphertext\",\n        placeholder=\"Paste ciphertext here, or load the sample.\",\n    )\n\n    if st.button(\"Analyze\", type=\"primary\"):\n        # Store the text that was analyzed. Tab clicks rerun the script,\n        # and the button itself is True only on the click that produced it.\n        st.session_state[\"caesar_analyzed\"] = ciphertext\n        st.rerun()\n\n    table_tab, chart_tab = st.tabs([\"All 25 keys\", \"Frequency charts\"])\n\n    if not analyzed or ranked is None or best is None:\n        return\n\n    with table_tab:\n        frame = pd.DataFrame(ranked)\n        frame = frame.rename(\n            columns={\n                \"rank\": \"Rank\",\n                \"key\": \"Key\",\n                \"plaintext\": \"Plaintext\",\n                \"chi_squared\": \"Chi-squared\",\n                \"word_score\": \"Word score\",\n            }\n        )\n        frame[\"Chi-squared\"] = frame[\"Chi-squared\"].map(lambda value: round(float(value), 3))\n        frame[\"Word score\"] = frame[\"Word score\"].map(lambda value: round(float(value), 3))\n        st.dataframe(frame, width=\"stretch\", hide_index=True)\n        st.caption(\"Rank 1 is the lowest chi-squared score. The word score breaks ties.\")\n\n    with chart_tab:\n        st.write(\"The English fingerprint is the gold bars. A good decryption should follow them.\")\n        left, right = st.columns(2)\n        with left:\n            _show_chart(analyzed, \"Ciphertext vs English\")\n        with right:\n            _show_chart(best[\"plaintext\"], \"Best decryption vs English\")\n\n\ndef _show_substitution_answer(solution: dict[str, object]) -> None:\n    \"\"\"Draw the recovered substitution plaintext above the ciphertext box.\"\"\"\n    ciphertext = str(solution[\"ciphertext\"])\n    plaintext = str(solution[\"plaintext\"])\n    score = float(solution[\"score\"])  # type: ignore[arg-type]\n    if is_text_too_short(ciphertext):\n        st.warning(\n            \"This ciphertext has fewer than 25 letters. A substitution solver \"\n            \"needs a much longer sample before the bigram score is trustworthy.\"\n        )\n    safe_plaintext = html.escape(plaintext) if plaintext else \"—\"\n    st.markdown(\n        f\"\"\"\n        \u003cdiv class=\"telegram\">\n            \u003cdiv class=\"stat-label\">Bigram log-score\u003c/div>\n            \u003cdiv class=\"stat-value\">{score:.1f}\u003c/div>\n            \u003ch3>Recovered plaintext\u003c/h3>\n            \u003cp class=\"plain-out\">{safe_plaintext}\u003c/p>\n        \u003c/div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n    st.caption(\n        \"Higher bigram log-score means more English-like letter pairs. \"\n        \"The score is negative because it is a sum of logarithms.\"\n    )\n\n\ndef _render_substitution() -> None:\n    \"\"\"Break a general substitution cipher with the hill-climbing solver.\"\"\"\n    st.subheader(\"Break Substitution Cipher\")\n    st.write(\n        \"A full substitution key is a permutation of A–Z. Brute force cannot \"\n        \"search 26! keys, so the solver starts from letter frequencies and \"\n        \"swaps letters whenever the English bigram score improves.\"\n    )\n    if st.button(\"Load lecture sample and solve\"):\n        st.session_state[\"substitution_ciphertext\"] = LECTURE_SUBSTITUTION\n        st.session_state[\"lecture_step\"] = 4\n        with st.spinner(\"Climbing the key space...\"):\n            key, plaintext, score = hill_climb_solve(LECTURE_SUBSTITUTION, seed=4)\n        st.session_state[\"substitution_solution\"] = {\n            \"ciphertext\": LECTURE_SUBSTITUTION,\n            \"key\": key,\n            \"plaintext\": plaintext,\n            \"score\": score,\n        }\n        st.rerun()\n\n    solution = st.session_state.get(\"substitution_solution\")\n    if solution is None:\n        st.markdown(\n            '\u003cdiv class=\"note-card\">Press \u003cb>Solve\u003c/b>, or use sidebar button 4. A few thousand swaps usually take a few seconds.\u003c/div>',\n            unsafe_allow_html=True,\n        )\n    else:\n        _show_substitution_answer(solution)\n\n    ciphertext = st.text_area(\n        \"Substitution ciphertext\",\n        height=160,\n        key=\"substitution_ciphertext\",\n        placeholder=\"Paste a longer English ciphertext, or load the lecture sample.\",\n    )\n    if st.button(\"Solve\", type=\"primary\"):\n        with st.spinner(\"Climbing the key space...\"):\n            key, plaintext, score = hill_climb_solve(ciphertext)\n        st.session_state[\"substitution_solution\"] = {\n            \"ciphertext\": ciphertext,\n            \"key\": key,\n            \"plaintext\": plaintext,\n            \"score\": score,\n        }\n        st.rerun()\n\n    if solution is None:\n        return\n\n    key = solution[\"key\"]\n    map_tab = st.tabs([\"Key mapping\"])[0]\n    with map_tab:\n        st.write(\"Read each pair as plaintext letter → ciphertext letter.\")\n        pairs = [\n            f\"\u003cb>{ALPHABET[index]}\u003c/b>→{key[index]}\" for index in range(26)\n        ]\n        st.markdown(\n            f'\u003cdiv class=\"map-row\">{\"&nbsp;&nbsp;\".join(pairs[:13])}\u003c/div>',\n            unsafe_allow_html=True,\n        )\n        st.markdown(\n            f'\u003cdiv class=\"map-row\">{\"&nbsp;&nbsp;\".join(pairs[13:])}\u003c/div>',\n            unsafe_allow_html=True,\n        )\n        st.code(key, language=None)\n        st.caption(\"The key string is 26 letters: position 1 (A) through position 26 (Z).\")\n\n\ndef _render_encrypt() -> None:\n    \"\"\"Encrypt a live plaintext, with a button that loads the classroom sample.\"\"\"\n    st.subheader(\"Encrypt Demo\")\n    st.write(\"Shift a sentence forward, then paste the ciphertext into Break Caesar Cipher.\")\n\n    demo_tab, how_tab = st.tabs([\"Live encrypt\", \"How the shift works\"])\n\n    with demo_tab:\n        # The ciphertext card is filled after the inputs, but drawn above them.\n        result_slot = st.container()\n        if \"demo_plaintext\" not in st.session_state:\n            st.session_state[\"demo_plaintext\"] = \"\"\n        if \"demo_shift\" not in st.session_state:\n            st.session_state[\"demo_shift\"] = SAMPLE_SHIFT\n\n        if st.button(\"Load sample (fills KHOOR ZRUOG)\"):\n            st.session_state[\"demo_plaintext\"] = SAMPLE_PLAINTEXT\n            st.session_state[\"demo_shift\"] = SAMPLE_SHIFT\n            st.session_state[\"demo_ready\"] = True\n\n        plaintext = st.text_area(\n            \"Plaintext\",\n            height=140,\n            key=\"demo_plaintext\",\n            placeholder=\"Type a sentence to encrypt.\",\n        )\n        shift = st.number_input(\n            \"Shift (key)\",\n            min_value=1,\n            max_value=25,\n            step=1,\n            key=\"demo_shift\",\n        )\n        if st.button(\"Encrypt\", type=\"primary\"):\n            st.session_state[\"demo_ready\"] = True\n\n        if st.session_state.get(\"demo_ready\") and plaintext:\n            produced = caesar_encrypt(plaintext, int(shift))\n            safe_ciphertext = html.escape(produced)\n            with result_slot:\n                st.markdown(\n                    f\"\"\"\n                    \u003cdiv class=\"telegram\">\n                        \u003ch3>Ciphertext\u003c/h3>\n                        \u003cp class=\"plain-out\">{safe_ciphertext}\u003c/p>\n                    \u003c/div>\n                    \"\"\",\n                    unsafe_allow_html=True,\n                )\n                st.caption(\"Key k shifts each letter forward by k.\")\n        elif st.session_state.get(\"demo_ready\"):\n            with result_slot:\n                st.info(\"Enter a plaintext sentence, or load the sample that produces KHOOR ZRUOG.\")\n\n    with how_tab:\n        st.markdown(\n            \"\"\"\n            \u003cdiv class=\"explain-card\">\n                \u003ch3>One rule, 25 keys\u003c/h3>\n                \u003cp>Key k moves every letter forward k places in the alphabet and wraps from Z back to A.\n                \"HELLO\" with key 3 becomes \"KHOOR\" because H→K, E→H, L→O, L→O, O→R.\n                Spaces and punctuation stay put, which is why the word breaks still show.\u003c/p>\n                \u003cp>Decryption uses the same rule in reverse. The attack does not need the key:\n                it tries all 25 reverse shifts and measures which result looks like English.\u003c/p>\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n\ndef _render_explanation() -> None:\n    \"\"\"Static lecture notes: key space, the frequency fingerprint, and limits.\"\"\"\n    st.subheader(\"Why Monoalphabetic Ciphers Fail\")\n    space_tab, print_tab, limit_tab = st.tabs(\n        [\"Key space\", \"Frequency fingerprint\", \"Limitations\"]\n    )\n\n    with space_tab:\n        caesar_col, full_col = st.columns(2)\n        caesar_col.metric(\"Caesar keys\", \"25\")\n        full_col.metric(\"Substitution keys\", \"26!\")\n        st.markdown(\n            \"\"\"\n            \u003cdiv class=\"explain-card\">\n                \u003ch3>25 versus 26 factorial\u003c/h3>\n                \u003cp>A Caesar key is only a shift, so keys 1 through 25 can be tried by hand\n                or in one short loop. A general monoalphabetic key can send A to any of\n                26 letters, B to any of the remaining 25, and so on:\u003c/p>\n                \u003cp>\u003cb>26! = 403,291,461,126,605,635,584,000,000\u003c/b> (about 4.03 × 10\u003csup>26\u003c/sup>).\u003c/p>\n                \u003cp>That space is far too large to brute force. Frequency analysis does not\n                visit every key. It proposes one good guess, then hill climbing swaps\n                letters only when the text becomes more English-like.\u003c/p>\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n    with print_tab:\n        st.markdown(\n            \"\"\"\n            \u003cdiv class=\"explain-card\">\n                \u003ch3>The fingerprint survives\u003c/h3>\n                \u003cp>In a monoalphabetic cipher each plaintext letter always becomes the\n                same ciphertext letter. The names change; the crowd does not.\n                E is still the tallest bar, and Z is still rare. Caesar only rotates\n                that bar chart. A full substitution rearranges the bars, but the\n                heights are the same multiset.\u003c/p>\n                \u003cp>\u003cb>Chi-squared\u003c/b> compares a candidate's letter counts with the\n                English percentages. For each letter it adds\n                (observed − expected)\u003csup>2\u003c/sup> / expected. The candidate with the\n                smallest total is the most English-like. Common words are used only\n                to break an exact tie.\u003c/p>\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n        # A static picture of the English fingerprint, with no ciphertext required.\n        _show_chart(\n            _english_sample(),\n            \"The English letter fingerprint these attacks look for\",\n        )\n\n    with limit_tab:\n        st.markdown(\n            \"\"\"\n            \u003cdiv class=\"explain-card\">\n                \u003ch3>Where the demo stops being reliable\u003c/h3>\n                \u003cp>\u003cb>Short ciphertext.\u003c/b> Under 25 letters, chi-squared is mostly noise.\n                The app shows a warning instead of pretending the top key is certain.\n                The accuracy experiment in \u003ccode>experiments/accuracy.py\u003c/code> prints\n                how often Caesar recovery succeeds at lengths 10, 20, 50, 100, and 200.\u003c/p>\n                \u003cp>\u003cb>English only.\u003c/b> The frequency table, the word list, and the\n                bigram table are English. A French or Hindi message needs its own tables.\u003c/p>\n                \u003cp>\u003cb>Classical ciphers only.\u003c/b> AES and other modern ciphers are not\n                a single letter-for-letter map. They mix the message so thoroughly that\n                ciphertext letter frequencies look flat, and knowing one letter tells\n                you nothing about the next. A 128-bit key is also far beyond 26!.\u003c/p>\n            \u003c/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n\ndef _start_encrypt_demo() -> None:\n    \"\"\"Open the encrypt page on HELLO WORLD with shift 3 already applied.\"\"\"\n    st.session_state[\"mode\"] = \"Encrypt Demo\"\n    st.session_state[\"demo_plaintext\"] = SAMPLE_PLAINTEXT\n    st.session_state[\"demo_shift\"] = SAMPLE_SHIFT\n    st.session_state[\"demo_ready\"] = True\n    st.session_state[\"lecture_step\"] = 1\n\n\ndef _start_long_caesar() -> None:\n    \"\"\"Open Caesar analysis on the prepared paragraph and show the ranking.\"\"\"\n    st.session_state[\"mode\"] = \"Break Caesar Cipher\"\n    st.session_state[\"caesar_ciphertext\"] = LECTURE_CAESAR\n    st.session_state[\"caesar_analyzed\"] = LECTURE_CAESAR\n    st.session_state[\"lecture_step\"] = 2\n\n\ndef _start_short_caesar() -> None:\n    \"\"\"Open Caesar analysis on KHOOR ZRUOG so the short-text warning appears.\"\"\"\n    st.session_state[\"mode\"] = \"Break Caesar Cipher\"\n    st.session_state[\"caesar_ciphertext\"] = SAMPLE_CIPHERTEXT\n    st.session_state[\"caesar_analyzed\"] = SAMPLE_CIPHERTEXT\n    st.session_state[\"lecture_step\"] = 3\n\n\ndef _start_substitution() -> None:\n    \"\"\"Solve the prepared substitution ciphertext with the fixed lecture seed.\"\"\"\n    st.session_state[\"mode\"] = \"Break Substitution Cipher\"\n    st.session_state[\"substitution_ciphertext\"] = LECTURE_SUBSTITUTION\n    st.session_state[\"lecture_step\"] = 4\n    with st.spinner(\"Climbing the key space...\"):\n        key, plaintext, score = hill_climb_solve(LECTURE_SUBSTITUTION, seed=4)\n    st.session_state[\"substitution_solution\"] = {\n        \"ciphertext\": LECTURE_SUBSTITUTION,\n        \"key\": key,\n        \"plaintext\": plaintext,\n        \"score\": score,\n    }\n\n\ndef _start_explanation() -> None:\n    \"\"\"Open the explanation page used for the closing minute.\"\"\"\n    st.session_state[\"mode\"] = \"Why Monoalphabetic Ciphers Fail\"\n    st.session_state[\"lecture_step\"] = 5\n\n\ndef _lecture_sidebar() -> None:\n    \"\"\"Five buttons, in the order to click them during the presentation.\"\"\"\n    st.sidebar.markdown(\"## Present this\")\n    st.sidebar.caption(\"Click in order. Nothing to type or paste.\")\n    if st.sidebar.button(\"1. Show the shift\"):\n        _start_encrypt_demo()\n    if st.sidebar.button(\"2. Break a paragraph\"):\n        _start_long_caesar()\n    if st.sidebar.button(\"3. Short text fails\"):\n        _start_short_caesar()\n    if st.sidebar.button(\"4. Crack substitution\"):\n        _start_substitution()\n    if st.sidebar.button(\"5. Why it fails\"):\n        _start_explanation()\n\n\ndef _lecture_banner(mode: str) -> None:\n    \"\"\"Show the line to say for the lecture step that opened this page.\"\"\"\n    step = st.session_state.get(\"lecture_step\")\n    if not isinstance(step, int):\n        return\n    if LECTURE_STEP_MODE.get(step) != mode:\n        return\n    st.info(LECTURE_CUES[step])\n\n\ndef main() -> None:\n    \"\"\"Build the wide Streamlit page and dispatch the selected mode.\"\"\"\n    st.set_page_config(\n        page_title=\"Automated Cryptanalysis of Classical Ciphers\",\n        page_icon=\"⌕\",\n        layout=\"wide\",\n    )\n    _inject_styles()\n    if \"mode\" not in st.session_state:\n        st.session_state[\"mode\"] = MODES[0]\n\n    # Lecture buttons update the mode before the radio button is created,\n    # and before the title, so a lecture step can use the shorter header.\n    _lecture_sidebar()\n    _hero(compact=bool(st.session_state.get(\"lecture_step\")))\n    st.sidebar.markdown(\"## Or pick a page\")\n    mode = st.sidebar.radio(\n        \"Mode\",\n        MODES,\n        label_visibility=\"collapsed\",\n        key=\"mode\",\n    )\n    st.sidebar.markdown(\"---\")\n    st.sidebar.write(\n        \"Key k means the ciphertext was shifted forward by k. \"\n        \"Decryption shifts back by k.\"\n    )\n    st.sidebar.caption(\"College project · Caesar cipher and frequency analysis\")\n\n    _lecture_banner(mode)\n    if mode == \"Break Caesar Cipher\":\n        _render_caesar()\n    elif mode == \"Break Substitution Cipher\":\n        _render_substitution()\n    elif mode == \"Encrypt Demo\":\n        _render_encrypt()\n    else:\n        _render_explanation()\n\n\nif __name__ == \"__main__\":\n    main()\n", "cryptanalysis/__init__.py": "\"\"\"Cryptanalysis tools for classical monoalphabetic ciphers.\n\nThis package recovers plaintext from a Caesar cipher or a general\nsubstitution cipher without being given the key. It is a teaching\nproject: every public function is small enough to explain in a lab.\n\"\"\"\n", "cryptanalysis/caesar.py": "\"\"\"Caesar cipher encryption, decryption, and brute-force search.\n\nConvention used everywhere in this project\n------------------------------------------\n\"Key k\" means each plaintext letter was shifted *forward* by k positions\nto produce the ciphertext. Decryption therefore shifts *backward* by k.\n\nExample: \"HELLO WORLD\" encrypted with key 3 becomes \"KHOOR ZRUOG\".\nDecrypting \"KHOOR ZRUOG\" with key 3 returns \"HELLO WORLD\".\nKey 1 returns \"JGNNQ YQTNF\", and key 2 returns \"IFMMP XPSME\".\n\"\"\"\n\nfrom __future__ import annotations\n\n\ndef _shift_letter(character: str, shift: int) -> str:\n    \"\"\"Shift one character by ``shift`` places, preserving non-letters.\n\n    Uppercase and lowercase are shifted inside their own alphabet so\n    \"Hello\" stays \"Hello\" in shape. Digits, spaces, and punctuation\n    are returned unchanged. The shift is wrapped with modulo 26, so\n    a shift of 27 is the same as a shift of 1.\n    \"\"\"\n    if character.isupper():\n        alphabet_start = ord(\"A\")\n        offset = ord(character) - alphabet_start\n        return chr(alphabet_start + (offset + shift) % 26)\n    if character.islower():\n        alphabet_start = ord(\"a\")\n        offset = ord(character) - alphabet_start\n        return chr(alphabet_start + (offset + shift) % 26)\n    return character\n\n\ndef caesar_encrypt(text: str, shift: int) -> str:\n    \"\"\"Encrypt ``text`` by shifting every letter forward by ``shift``.\n\n    Only the letters A-Z and a-z move. Case, spaces, digits, and\n    punctuation are preserved.\n    \"\"\"\n    return \"\".join(_shift_letter(character, shift) for character in text)\n\n\ndef caesar_decrypt(text: str, shift: int) -> str:\n    \"\"\"Decrypt ``text`` that was encrypted with Caesar key ``shift``.\n\n    This is encryption with the opposite shift. Key 3 decrypts by\n    shifting each letter back three places.\n    \"\"\"\n    return caesar_encrypt(text, -shift)\n\n\ndef brute_force(ciphertext: str) -> list[tuple[int, str]]:\n    \"\"\"Try every useful Caesar key and return ``(key, plaintext)`` pairs.\n\n    Key 0 is skipped because it leaves the ciphertext unchanged, so\n    there are exactly 25 candidates (keys 1 through 25).\n    \"\"\"\n    return [(key, caesar_decrypt(ciphertext, key)) for key in range(1, 26)]\n", "cryptanalysis/english_stats.py": "\"\"\"English language statistics used to recognise likely plaintext.\n\nMonoalphabetic ciphers hide the letters but not the habits of the\nlanguage. These tables record those habits: how often each letter\nappears, and a short list of everyday words.\n\"\"\"\n\nfrom __future__ import annotations\n\n# Standard English letter frequencies, in percent.\n# Source values are the figures required by the project brief.\n# They sum to about 100, so each value is \"percent of all letters\".\nENGLISH_FREQ: dict[str, float] = {\n    \"E\": 12.70,\n    \"T\": 9.06,\n    \"A\": 8.17,\n    \"O\": 7.51,\n    \"I\": 6.97,\n    \"N\": 6.75,\n    \"S\": 6.33,\n    \"H\": 6.09,\n    \"R\": 6.00,\n    \"D\": 4.25,\n    \"L\": 4.03,\n    \"C\": 2.78,\n    \"U\": 2.76,\n    \"M\": 2.41,\n    \"W\": 2.36,\n    \"F\": 2.23,\n    \"G\": 2.02,\n    \"Y\": 1.97,\n    \"P\": 1.93,\n    \"B\": 1.49,\n    \"V\": 0.98,\n    \"K\": 0.77,\n    \"J\": 0.15,\n    \"X\": 0.15,\n    \"Q\": 0.10,\n    \"Z\": 0.07,\n}\n\n# About 100 very common English words. Matching these in a candidate\n# decryption is a second signal that the text is real English.\n# \"hello\" and \"world\" are included so the classic classroom example\n# \"HELLO WORLD\" can be recognised as a dictionary hit.\nCOMMON_WORDS: list[str] = [\n    \"the\", \"be\", \"to\", \"of\", \"and\", \"a\", \"in\", \"that\", \"have\", \"i\",\n    \"it\", \"for\", \"not\", \"on\", \"with\", \"he\", \"as\", \"you\", \"do\", \"at\",\n    \"this\", \"but\", \"his\", \"by\", \"from\", \"they\", \"we\", \"say\", \"her\", \"she\",\n    \"or\", \"an\", \"will\", \"my\", \"one\", \"all\", \"would\", \"there\", \"their\", \"what\",\n    \"so\", \"up\", \"out\", \"if\", \"about\", \"who\", \"get\", \"which\", \"go\", \"me\",\n    \"when\", \"make\", \"can\", \"like\", \"time\", \"no\", \"just\", \"him\", \"know\", \"take\",\n    \"people\", \"into\", \"year\", \"your\", \"good\", \"some\", \"could\", \"them\", \"see\", \"other\",\n    \"than\", \"then\", \"now\", \"look\", \"only\", \"come\", \"its\", \"over\", \"think\", \"also\",\n    \"back\", \"after\", \"use\", \"two\", \"how\", \"our\", \"work\", \"first\", \"well\", \"way\",\n    \"even\", \"new\", \"want\", \"because\", \"any\", \"these\", \"give\", \"day\", \"most\", \"us\",\n    \"hello\", \"world\", \"is\", \"are\", \"was\", \"were\", \"been\", \"has\", \"had\", \"text\",\n]\n", "cryptanalysis/frequency.py": "\"\"\"Frequency analysis and scoring for Caesar cipher candidates.\n\nA Caesar cipher only rotates the alphabet, so the letter-frequency\nfingerprint of English survives. These functions measure that\nfingerprint and rank the 25 possible keys.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport re\nfrom typing import TypedDict\n\nfrom cryptanalysis.caesar import brute_force\nfrom cryptanalysis.english_stats import COMMON_WORDS, ENGLISH_FREQ\n\n# Lookup set so dictionary checks are a single hash lookup per word.\n_COMMON_WORD_SET: set[str] = set(COMMON_WORDS)\n\n# The 26 letters, in alphabet order. Charts and counts always use this order.\nALPHABET: str = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n\n\nclass CaesarCandidate(TypedDict):\n    \"\"\"One decrypted Caesar candidate, plus the scores used to rank it.\"\"\"\n\n    rank: int\n    key: int\n    plaintext: str\n    chi_squared: float\n    word_score: float\n\n\ndef letter_counts(text: str) -> dict[str, int]:\n    \"\"\"Count A-Z letters in ``text``, ignoring case and non-letters.\n\n    Every letter from A to Z is present in the result, even when its\n    count is zero. That keeps later percentage and chi-squared code\n    from having to handle missing keys.\n    \"\"\"\n    counts: dict[str, int] = {letter: 0 for letter in ALPHABET}\n    for character in text.upper():\n        if character in counts:\n            counts[character] += 1\n    return counts\n\n\ndef letter_percentages(text: str) -> dict[str, float]:\n    \"\"\"Return A-Z letter frequencies in ``text`` as percentages.\n\n    The scale matches ``ENGLISH_FREQ``: 12.7 means \"12.7 percent of\n    the letters\", not a fraction between 0 and 1. An empty text\n    returns 0 for every letter.\n    \"\"\"\n    counts = letter_counts(text)\n    total = sum(counts.values())\n    if total == 0:\n        return {letter: 0.0 for letter in ALPHABET}\n    return {letter: (counts[letter] / total) * 100.0 for letter in ALPHABET}\n\n\ndef chi_squared(text: str) -> float:\n    \"\"\"Chi-squared distance between ``text`` and standard English.\n\n    For each letter the formula is ``(observed - expected) ** 2 / expected``.\n    ``observed`` is the raw count. ``expected`` is the English percentage\n    scaled to the same number of letters. A lower total means the text\n    looks more like English. Text with no letters returns infinity so\n    it sorts to the bottom of a ranking.\n    \"\"\"\n    counts = letter_counts(text)\n    total = sum(counts.values())\n    if total == 0:\n        return math.inf\n\n    # Normalise in case the published percentages are a hair off 100.\n    frequency_total = sum(ENGLISH_FREQ.values())\n    statistic = 0.0\n    for letter in ALPHABET:\n        observed = counts[letter]\n        expected = (ENGLISH_FREQ[letter] / frequency_total) * total\n        statistic += (observed - expected) ** 2 / expected\n    return statistic\n\n\ndef dictionary_score(text: str) -> float:\n    \"\"\"Fraction of words in ``text`` that are in the common-word list.\n\n    Words are runs of letters. Case and surrounding punctuation are\n    ignored. The result is between 0 and 1. Text with no words scores 0.\n    \"\"\"\n    words = re.findall(r\"[A-Za-z]+\", text.lower())\n    if not words:\n        return 0.0\n    hits = sum(1 for word in words if word in _COMMON_WORD_SET)\n    return hits / len(words)\n\n\ndef rank_caesar_keys(ciphertext: str) -> list[CaesarCandidate]:\n    \"\"\"Rank all 25 Caesar keys. The best candidate has rank 1.\n\n    Each candidate is decrypted, then scored with chi-squared (lower\n    is better) and with the common-word fraction (higher is better).\n    Sort order is chi-squared first. The word score only breaks ties,\n    which matters for very short samples such as \"HELLO WORLD\".\n    \"\"\"\n    candidates: list[CaesarCandidate] = []\n    for key, plaintext in brute_force(ciphertext):\n        candidates.append(\n            {\n                \"rank\": 0,\n                \"key\": key,\n                \"plaintext\": plaintext,\n                \"chi_squared\": chi_squared(plaintext),\n                \"word_score\": dictionary_score(plaintext),\n            }\n        )\n\n    candidates.sort(key=lambda row: (row[\"chi_squared\"], -row[\"word_score\"], row[\"key\"]))\n    for index, row in enumerate(candidates, start=1):\n        row[\"rank\"] = index\n    return candidates\n\n\ndef confidence(ranked: list[CaesarCandidate]) -> float:\n    \"\"\"Score from 0 to 100 for how clearly the best key beats the runner-up.\n\n    The gap is ``(second - best) / second``. A big gap means the best\n    chi-squared value is much smaller than the next one, so the result\n    is trustworthy. Equal scores, missing rows, or infinite scores\n    (no letters) produce 0.\n    \"\"\"\n    if len(ranked) \u003c 2:\n        return 0.0\n\n    best = float(ranked[0][\"chi_squared\"])\n    second = float(ranked[1][\"chi_squared\"])\n    if math.isinf(best) or math.isinf(second) or second == 0:\n        return 0.0\n\n    gap = (second - best) / second * 100.0\n    return max(0.0, min(100.0, gap))\n\n\ndef is_text_too_short(text: str, minimum: int = 25) -> bool:\n    \"\"\"Return True when ``text`` has fewer than ``minimum`` letters.\n\n    Frequency counts from a handful of letters are mostly noise, so\n    callers show a warning instead of trusting the top key blindly.\n    \"\"\"\n    letter_total = sum(letter_counts(text).values())\n    return letter_total \u003c minimum\n", "cryptanalysis/report.py": "\"\"\"Plain-text report for a Caesar ciphertext.\n\nRun from the project directory:\n\n    python -m cryptanalysis.report \"KHOOR ZRUOG\"\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\n\nfrom cryptanalysis.frequency import confidence, is_text_too_short, rank_caesar_keys\n\n\ndef format_report(ciphertext: str) -> str:\n    \"\"\"Return a multi-line Caesar analysis report for ``ciphertext``.\n\n    The three strongest keys are listed so the best one appears last\n    and is marked with a check. A confidence percentage is always\n    included. A warning line is added when the ciphertext has fewer\n    than 25 letters.\n    \"\"\"\n    ranked = rank_caesar_keys(ciphertext)\n    top_three = ranked[:3]\n    # Reverse the top three so the best key is printed last.\n    display_order = list(reversed(top_three))\n\n    lines: list[str] = [\n        f\"Ciphertext: {ciphertext}\",\n        \"\",\n        \"Cipher Type: Caesar Cipher\",\n        \"Possible Keys:\",\n    ]\n\n    best_key = ranked[0][\"key\"] if ranked else None\n    for row in display_order:\n        marker = \" ✓\" if row[\"key\"] == best_key else \"\"\n        lines.append(f\"Key {row['key']} -> {row['plaintext']}{marker}\")\n\n    likely_plaintext = ranked[0][\"plaintext\"] if ranked else \"\"\n    lines.append(\"\")\n    lines.append(f\"Likely Plaintext: {likely_plaintext}\")\n    lines.append(f\"Confidence: {confidence(ranked):.1f}%\")\n    if is_text_too_short(ciphertext):\n        lines.append(\n            \"Warning: Ciphertext is too short for a reliable result (fewer than 25 letters).\"\n        )\n    return \"\\n\".join(lines)\n\n\ndef main(argv: list[str] | None = None) -> None:\n    \"\"\"Print a report for the ciphertext given on the command line.\"\"\"\n    arguments = list(sys.argv[1:] if argv is None else argv)\n    if not arguments:\n        print('Usage: python -m cryptanalysis.report \"KHOOR ZRUOG\"')\n        return\n    # Join so a quoted sentence with spaces arrives as one ciphertext.\n    ciphertext = \" \".join(arguments)\n    print(format_report(ciphertext))\n\n\nif __name__ == \"__main__\":\n    main()\n", "cryptanalysis/substitution.py": "\"\"\"Hill-climbing solver for a general monoalphabetic substitution cipher.\n\nAlgorithm\n---------\nA substitution cipher replaces each plaintext letter with one fixed\nciphertext letter. The key is a permutation of the 26 letters: position\n0 says what plaintext A becomes, position 1 says what B becomes, and so\non. There are 26! such keys (about 4 x 10^26), so trying every key is\nimpossible. This module searches instead:\n\n1. ``initial_guess`` lines the ciphertext letters up by frequency with\n   the English letters E, T, A, O, I, N, ... The most common ciphertext\n   letter is guessed to be E, the next to be T, and so on.\n2. ``hill_climb_solve`` turns that guess into a key, then repeatedly\n   swaps two letters in the key. A swap is kept only when the bigram\n   log-probability of the decrypted text goes up.\n3. Later restarts begin from a fresh random permutation, so one unlucky\n   local peak does not end the search. The first restart still starts\n   from the frequency guess.\n4. A final pass tries every pair of letters and keeps any swap that\n   still improves the score. That locks in gains the random swaps missed.\n\nThe score is the sum of log probabilities of consecutive letter pairs\ninside each word. Common English pairs such as TH and HE raise the\nscore. Pairs that almost never occur pull it down. Spaces break words,\nso \"THE CAT\" contributes TH, HE, CA, and AT. The pair EC is not counted,\nbecause those letters were never neighbours in English; only the cipher\nleft them on either side of a space.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport random\n\nfrom cryptanalysis.english_stats import ENGLISH_FREQ\nfrom cryptanalysis.frequency import ALPHABET, letter_counts\n\n# Approximate percent frequencies of the most common English letter pairs.\n# The exact values are rounded textbook figures. Only the ranking among\n# pairs matters to the hill climber, not the third decimal place.\nBIGRAM_FREQ: dict[str, float] = {\n    \"TH\": 2.71, \"HE\": 2.33, \"IN\": 2.03, \"ER\": 1.78, \"AN\": 1.61,\n    \"RE\": 1.41, \"ES\": 1.32, \"ON\": 1.32, \"ST\": 1.25, \"NT\": 1.17,\n    \"EN\": 1.13, \"AT\": 1.12, \"ED\": 1.08, \"ND\": 1.07, \"TO\": 1.07,\n    \"OR\": 1.06, \"EA\": 1.00, \"TI\": 0.99, \"AR\": 0.98, \"TE\": 0.98,\n    \"NG\": 0.89, \"AL\": 0.88, \"IT\": 0.88, \"AS\": 0.87, \"IS\": 0.86,\n    \"HA\": 0.83, \"ET\": 0.76, \"SE\": 0.73, \"OU\": 0.72, \"OF\": 0.71,\n    \"LE\": 0.69, \"SA\": 0.67, \"VE\": 0.66, \"RO\": 0.64, \"RA\": 0.64,\n    \"RI\": 0.63, \"HI\": 0.62, \"NE\": 0.59, \"ME\": 0.57, \"DE\": 0.55,\n    \"CO\": 0.55, \"IO\": 0.54, \"IC\": 0.53, \"EL\": 0.52, \"LI\": 0.51,\n    \"LL\": 0.50, \"CE\": 0.49, \"TA\": 0.48, \"MA\": 0.47, \"SI\": 0.46,\n    \"OM\": 0.45, \"UR\": 0.44, \"CA\": 0.43, \"LA\": 0.42, \"NS\": 0.41,\n    \"DI\": 0.40, \"FO\": 0.39, \"HO\": 0.38, \"PE\": 0.37, \"EC\": 0.36,\n    \"PR\": 0.35, \"NO\": 0.34, \"CT\": 0.33, \"US\": 0.32, \"AC\": 0.31,\n    \"OT\": 0.31, \"IL\": 0.30, \"TR\": 0.30, \"LY\": 0.29, \"NC\": 0.28,\n    \"UT\": 0.27, \"SS\": 0.27, \"SO\": 0.26, \"RS\": 0.26, \"UN\": 0.25,\n    \"LO\": 0.25, \"WA\": 0.24, \"GE\": 0.24, \"IE\": 0.23, \"WH\": 0.23,\n    \"EE\": 0.22, \"WI\": 0.21, \"EM\": 0.20, \"AD\": 0.20, \"OL\": 0.19,\n    \"RT\": 0.19, \"PO\": 0.18, \"WE\": 0.18, \"RD\": 0.17, \"KE\": 0.16,\n    \"GH\": 0.15, \"RY\": 0.15, \"CH\": 0.14, \"BE\": 0.14, \"OW\": 0.13,\n    \"LD\": 0.13,\n}\n\n# Unseen pairs are rare, not impossible. A small floor stops log(0)\n# and still punishes pairs that are missing from the table above.\n_UNSEEN_BIGRAM_FLOOR: float = 0.005\n\n\ndef _build_log_table() -> dict[str, float]:\n    \"\"\"Pre-compute log probability for every possible letter pair.\n\n    Listed bigrams use their table value. Every other pair uses the\n    floor. Dividing by the grand total turns those weights into\n    probabilities before the logarithm.\n    \"\"\"\n    listed_total = sum(BIGRAM_FREQ.values())\n    unseen_pairs = (26 * 26) - len(BIGRAM_FREQ)\n    grand_total = listed_total + (_UNSEEN_BIGRAM_FLOOR * unseen_pairs)\n\n    log_table: dict[str, float] = {}\n    for first in ALPHABET:\n        for second in ALPHABET:\n            pair = first + second\n            weight = BIGRAM_FREQ.get(pair, _UNSEEN_BIGRAM_FLOOR)\n            log_table[pair] = math.log(weight / grand_total)\n    return log_table\n\n\n_LOG_PROB: dict[str, float] = _build_log_table()\n\n\ndef _words(text: str) -> list[str]:\n    \"\"\"Return the uppercase words in ``text``.\n\n    A word is a run of letters. Spaces and punctuation separate words,\n    so bigrams are not counted across a gap the cipher never mixed.\n    \"\"\"\n    cleaned = \"\".join(character.upper() if character.isalpha() else \" \" for character in text)\n    return [word for word in cleaned.split(\" \") if word]\n\n\ndef _validate_key(key: str) -> str:\n    \"\"\"Return ``key`` in uppercase, or raise ValueError if it is not a permutation.\"\"\"\n    normalised = key.upper()\n    if len(normalised) != 26 or sorted(normalised) != list(ALPHABET):\n        raise ValueError(\"key must be a 26-letter permutation of A-Z\")\n    return normalised\n\n\ndef substitution_encrypt(text: str, key: str) -> str:\n    \"\"\"Encrypt ``text`` with a 26-letter substitution ``key``.\n\n    ``key[0]`` is the ciphertext letter for plaintext A, ``key[1]`` is\n    the ciphertext letter for B, and so on. Case is preserved.\n    Non-letters are copied through unchanged.\n    \"\"\"\n    normalised = _validate_key(key)\n    mapping = {ALPHABET[index]: normalised[index] for index in range(26)}\n    output: list[str] = []\n    for character in text:\n        if character.isalpha():\n            replacement = mapping[character.upper()]\n            output.append(replacement if character.isupper() else replacement.lower())\n        else:\n            output.append(character)\n    return \"\".join(output)\n\n\ndef substitution_decrypt(text: str, key: str) -> str:\n    \"\"\"Decrypt ``text`` that was encrypted with substitution ``key``.\n\n    The encryption key maps plaintext letters to ciphertext letters.\n    Inverting that map, then encrypting with the inverse, recovers\n    the plaintext.\n    \"\"\"\n    normalised = _validate_key(key)\n    inverse = [\"?\"] * 26\n    for plain_index, cipher_letter in enumerate(normalised):\n        inverse[ord(cipher_letter) - ord(\"A\")] = ALPHABET[plain_index]\n    return substitution_encrypt(text, \"\".join(inverse))\n\n\ndef random_key(seed: int | None = None) -> str:\n    \"\"\"Return a random 26-letter permutation key.\n\n    Pass ``seed`` when a test or a demo must produce the same key again.\n    \"\"\"\n    generator = random.Random(seed)\n    letters = list(ALPHABET)\n    generator.shuffle(letters)\n    return \"\".join(letters)\n\n\ndef bigram_score(text: str) -> float:\n    \"\"\"Sum of log probabilities of consecutive letter pairs inside words.\n\n    Higher (closer to zero, since logs of probabilities are negative)\n    means the letter pairs look more like English. Pairs are not counted\n    across spaces or punctuation.\n    \"\"\"\n    total = 0.0\n    for word in _words(text):\n        for index in range(len(word) - 1):\n            total += _LOG_PROB[word[index] + word[index + 1]]\n    return total\n\n\ndef _cipher_bigram_counts(ciphertext: str) -> dict[str, int]:\n    \"\"\"Count ciphertext letter pairs inside each word, for fast rescoring.\"\"\"\n    counts: dict[str, int] = {}\n    for word in _words(ciphertext):\n        for index in range(len(word) - 1):\n            pair = word[index] + word[index + 1]\n            counts[pair] = counts.get(pair, 0) + 1\n    return counts\n\n\ndef _score_key(key: str, cipher_bigrams: dict[str, int]) -> float:\n    \"\"\"Score an encryption ``key`` using pre-counted ciphertext bigrams.\n\n    Each ciphertext pair is translated with the inverse of ``key``, then\n    looked up in the English log-probability table. Doing this from the\n    counts, rather than rebuilding the plaintext string, keeps the\n    thousands of trial swaps cheap.\n    \"\"\"\n    plain_for_cipher = [\"?\"] * 26\n    for plain_index, cipher_letter in enumerate(key):\n        plain_for_cipher[ord(cipher_letter) - ord(\"A\")] = ALPHABET[plain_index]\n\n    total = 0.0\n    for pair, count in cipher_bigrams.items():\n        plain_pair = (\n            plain_for_cipher[ord(pair[0]) - ord(\"A\")]\n            + plain_for_cipher[ord(pair[1]) - ord(\"A\")]\n        )\n        total += count * _LOG_PROB[plain_pair]\n    return total\n\n\ndef _swap_key(key: str, first: int, second: int) -> str:\n    \"\"\"Return ``key`` with the letters at two indexes exchanged.\"\"\"\n    characters = list(key)\n    characters[first], characters[second] = characters[second], characters[first]\n    return \"\".join(characters)\n\n\ndef initial_guess(ciphertext: str) -> str:\n    \"\"\"Build a frequency-based encryption key for ``ciphertext``.\n\n    Ciphertext letters are sorted from most common to least common.\n    English letters are sorted the same way (E, then T, then A, ...).\n    The most common ciphertext letter is assumed to decrypt to E, the\n    next to T, and so on. Ties are broken alphabetically so the guess\n    is stable. The returned string is an encryption key: index 0 is\n    the ciphertext image of plaintext A.\n    \"\"\"\n    counts = letter_counts(ciphertext)\n    cipher_order = sorted(ALPHABET, key=lambda letter: (-counts[letter], letter))\n    english_order = sorted(\n        ALPHABET,\n        key=lambda letter: (-ENGLISH_FREQ[letter], letter),\n    )\n\n    # decrypt_map[cipher_letter] = guessed plaintext letter.\n    decrypt_map = {\n        cipher_letter: english_letter\n        for cipher_letter, english_letter in zip(cipher_order, english_order)\n    }\n    encrypt_key = [\"?\"] * 26\n    for cipher_letter, plain_letter in decrypt_map.items():\n        encrypt_key[ord(plain_letter) - ord(\"A\")] = cipher_letter\n    return \"\".join(encrypt_key)\n\n\ndef _polish(key: str, cipher_bigrams: dict[str, int], max_passes: int = 40) -> tuple[str, float]:\n    \"\"\"Try every pair swap until none of them improves the score.\n\n    This is the same \"keep the swap only if the score rises\" rule as\n    the random search, but it checks all 325 pairs so a near-finished\n    key is not left one swap short of the best neighbour.\n    \"\"\"\n    current = key\n    current_score = _score_key(current, cipher_bigrams)\n    for _ in range(max_passes):\n        improved = False\n        for first in range(26):\n            for second in range(first + 1, 26):\n                trial = _swap_key(current, first, second)\n                trial_score = _score_key(trial, cipher_bigrams)\n                if trial_score > current_score:\n                    current = trial\n                    current_score = trial_score\n                    improved = True\n        if not improved:\n            break\n    return current, current_score\n\n\ndef hill_climb_solve(\n    ciphertext: str,\n    iterations: int = 5000,\n    restarts: int = 5,\n    seed: int | None = None,\n) -> tuple[str, str, float]:\n    \"\"\"Search for the substitution key and return ``(key, plaintext, score)``.\n\n    The first restart starts from ``initial_guess``. Each later restart\n    starts from a new random permutation, so the search can leave a\n    valley where the frequency guess got stuck. Inside a restart the\n    function proposes ``iterations`` random swaps and keeps a swap only\n    when the bigram score improves. Each restart then tries every pair\n    of letters and keeps improving swaps. The best key is returned.\n\n    ``score`` is the bigram log-probability of the recovered plaintext\n    (higher is better). ``seed`` makes the random swaps repeatable.\n    \"\"\"\n    if restarts \u003c 1:\n        raise ValueError(\"restarts must be at least 1\")\n    if iterations \u003c 0:\n        raise ValueError(\"iterations cannot be negative\")\n\n    generator = random.Random(seed)\n    starting_key = initial_guess(ciphertext)\n    cipher_bigrams = _cipher_bigram_counts(ciphertext)\n\n    best_key = starting_key\n    best_score = _score_key(best_key, cipher_bigrams)\n\n    for restart in range(restarts):\n        if restart == 0:\n            current = starting_key\n        else:\n            # A fresh permutation, so this restart is not stuck in the same\n            # valley as the frequency guess. The first restart still begins\n            # from that guess, which is the right start when the text is long.\n            letters = list(ALPHABET)\n            generator.shuffle(letters)\n            current = \"\".join(letters)\n        current_score = _score_key(current, cipher_bigrams)\n\n        for _ in range(iterations):\n            left, right = generator.sample(range(26), 2)\n            trial = _swap_key(current, left, right)\n            trial_score = _score_key(trial, cipher_bigrams)\n            if trial_score > current_score:\n                current = trial\n                current_score = trial_score\n\n        # Full pair check: keep any swap the random phase never proposed.\n        current, current_score = _polish(current, cipher_bigrams)\n        if current_score > best_score:\n            best_key = current\n            best_score = current_score\n    plaintext = substitution_decrypt(ciphertext, best_key)\n    # Report the public scoring function so the number matches bigram_score.\n    return best_key, plaintext, bigram_score(plaintext)\n"}</script>
